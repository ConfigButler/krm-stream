id: final-redaction-rotation
title: A final Secret rotation must deliver its changed redaction revision.
why: >
  Spec §6 includes redaction records in the visible comparison. The final token rotation leaves
  projected content excluding RV unchanged, but its changed redaction revision MUST reach the client.
  No later write or snapshot can repair a missed rotation; the hidden token must remain absent.
suites: [gateway, client]
scope: { target: demo, version: v1, resource: secrets, namespace: app }
projection: krm-full/v1
watch:
  - { op: list, bodies: [secret-token.v1] }
  - { op: modified, body: secret-token.v2 }
events:
  - { type: reset }
  - type: added
    body: secret-token.v1-wire
    redacted: [{ path: "/data/token", rev: 1 }, { path: "/data/username", rev: 1 }]
  - { type: synced }
  - type: modified
    body: secret-token.v2-wire
    redacted: [{ path: "/data/token", rev: 2 }, { path: "/data/username", rev: 1 }]
client:
  expect:
    uids: [secret-token-0001]
    dirty: []
    conflicts: []
    draftSubset:
      metadata: { resourceVersion: "4002" }
    absentPaths: [[data]]
    readOnlyPaths: [[data, token], [data, username]]
    patch: null
